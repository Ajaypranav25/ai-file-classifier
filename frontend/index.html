<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Index — local file search</title>
<style>
  :root {
    --ink: #0D0F12;
    --panel: #14171C;
    --paper: #E7E3D8;
    --slate: #8B93A1;
    --signal: #E8A33D;
    --wire: #262B33;
    --danger: #C2564A;
    --mono: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, "Inter", "Segoe UI", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ink);
    color: var(--paper);
    font-family: var(--sans);
    min-height: 100vh;
  }

  /* ---------- header / command bar ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(13,15,18,0.94);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--wire);
    padding: 18px 28px 14px;
  }
  .brand-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .brand {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--slate);
  }
  .brand b { color: var(--signal); }
  .index-count {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--slate);
  }
  .index-count b { color: var(--paper); font-weight: 600; }

  .search-row { display: flex; align-items: center; gap: 10px; }
  .search-row .glyph { font-family: var(--mono); color: var(--signal); font-size: 18px; }
  #q {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--paper);
    font-family: var(--mono);
    font-size: 20px;
    padding: 6px 0;
  }
  #q::placeholder { color: #4B515C; }
  .hint { font-family: var(--mono); font-size: 11px; color: var(--slate); border: 1px solid var(--wire); padding: 3px 7px; border-radius: 4px; }

  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .chip {
    font-family: var(--mono);
    font-size: 11.5px;
    padding: 5px 11px;
    border-radius: 999px;
    border: 1px solid var(--wire);
    color: var(--slate);
    cursor: pointer;
    user-select: none;
    transition: all 0.12s ease;
    white-space: nowrap;
  }
  .chip:hover { border-color: var(--signal); color: var(--paper); }
  .chip.active { background: var(--signal); border-color: var(--signal); color: var(--ink); font-weight: 600; }

  /* ---------- grid ---------- */
  main { padding: 24px 28px 60px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 14px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--wire);
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    transition: border-color 0.12s ease, transform 0.08s ease;
    display: flex;
    flex-direction: column;
  }
  .card:hover { border-color: var(--signal); transform: translateY(-1px); }
  .thumb-wrap {
    width: 100%;
    aspect-ratio: 4 / 3;
    background: #1B1F26;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }
  .thumb-wrap img { width: 100%; height: 100%; object-fit: cover; }
  .filetype-badge {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--slate);
    letter-spacing: 0.05em;
  }
  .card-body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; }
  .filename {
    font-size: 13px;
    font-weight: 600;
    color: var(--paper);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .meta-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .cat-tag {
    font-family: var(--mono);
    font-size: 10.5px;
    padding: 2px 7px;
    border-radius: 4px;
    background: #1B1F26;
    color: var(--slate);
    border: 1px solid var(--wire);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .date { font-family: var(--mono); font-size: 10.5px; color: #565D68; white-space: nowrap; }

  /* signature element: the match-strength meter */
  .meter-row { display: flex; align-items: center; gap: 6px; }
  .meter-track { flex: 1; height: 4px; background: var(--wire); border-radius: 2px; overflow: hidden; }
  .meter-fill { height: 100%; background: var(--signal); border-radius: 2px; }
  .meter-label { font-family: var(--mono); font-size: 10px; color: var(--signal); min-width: 30px; text-align: right; }

  .review-flag {
    font-family: var(--mono);
    font-size: 9.5px;
    color: var(--danger);
    letter-spacing: 0.06em;
  }

  .empty-state {
    text-align: center;
    padding: 90px 20px;
    color: var(--slate);
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.8;
  }
  .empty-state .big { font-size: 15px; color: var(--paper); margin-bottom: 8px; }

  /* ---------- correction modal ---------- */
  .overlay {
    position: fixed; inset: 0; background: rgba(13,15,18,0.72);
    display: none; align-items: center; justify-content: center; z-index: 50;
  }
  .overlay.open { display: flex; }
  .modal {
    background: var(--panel); border: 1px solid var(--wire); border-radius: 10px;
    width: min(420px, 90vw); padding: 20px;
  }
  .modal h3 { margin: 0 0 4px; font-size: 15px; }
  .modal .path { font-family: var(--mono); font-size: 11px; color: var(--slate); margin-bottom: 16px; word-break: break-all; }
  .cat-options { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 16px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
  .btn {
    font-family: var(--mono); font-size: 12px; padding: 7px 14px; border-radius: 6px;
    border: 1px solid var(--wire); background: transparent; color: var(--paper); cursor: pointer;
  }
  .btn.primary { background: var(--signal); color: var(--ink); border-color: var(--signal); font-weight: 600; }
  .btn:hover { border-color: var(--signal); }
</style>
</head>
<body>

<header>
  <div class="brand-row">
    <div class="brand"><b>&#9632;</b> INDEX — local screenshot &amp; downloads search</div>
    <div class="index-count"><b id="total-count">0</b> files indexed</div>
  </div>
  <div class="search-row">
    <span class="glyph">&gt;</span>
    <input id="q" type="text" placeholder="search by meaning — 'receipt from last week', 'that terminal error', 'blue login screen'..." autofocus>
    <span class="hint">/</span>
  </div>
  <div class="chips" id="chips"></div>
</header>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty-state" id="empty" style="display:none;">
    <div class="big">nothing indexed yet</div>
    run the watcher — <code>python -m app.main</code> — and drop a file in your<br>
    watched folder, or run <code>python -m train.bootstrap_labels</code> to backfill.
  </div>
</main>

<div class="overlay" id="overlay">
  <div class="modal">
    <h3>Recategorize</h3>
    <div class="path" id="modal-path"></div>
    <div class="cat-options" id="modal-cats"></div>
    <div class="modal-actions">
      <button class="btn" id="modal-cancel">Cancel</button>
    </div>
  </div>
</div>

<script>
const state = { category: "All", q: "", categories: [] };
let debounceTimer = null;

async function loadCategories() {
  const res = await fetch("/api/categories");
  const data = await res.json();
  state.categories = data.categories;
  document.getElementById("total-count").textContent = data.total.toLocaleString();

  const chips = document.getElementById("chips");
  chips.innerHTML = "";
  const allChip = makeChip("All", data.total);
  chips.appendChild(allChip);
  for (const cat of data.categories) {
    chips.appendChild(makeChip(cat, data.counts[cat] || 0));
  }
}

function makeChip(name, count) {
  const el = document.createElement("div");
  el.className = "chip" + (state.category === name ? " active" : "");
  el.textContent = `${name} · ${count}`;
  el.onclick = () => { state.category = name; runSearch(); loadCategories(); };
  return el;
}

function fmtDate(ts) {
  const d = new Date(ts * 1000);
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

function extBadge(ext) {
  return (ext || "file").replace(".", "").toUpperCase();
}

async function runSearch() {
  const params = new URLSearchParams({ q: state.q, category: state.category, limit: "80" });
  const res = await fetch(`/api/search?${params}`);
  const data = await res.json();
  renderGrid(data.results);
}

function renderGrid(results) {
  const grid = document.getElementById("grid");
  const empty = document.getElementById("empty");
  grid.innerHTML = "";
  empty.style.display = results.length === 0 ? "block" : "none";

  for (const r of results) {
    const card = document.createElement("div");
    card.className = "card";
    card.onclick = (e) => {
      if (e.target.closest(".recat-btn")) return;
      fetch(`/api/open?path=${encodeURIComponent(r.filepath)}`);
    };

    const thumbInner = r.thumbnail_path
      ? `<img src="/api/thumbnail/${r.id}" loading="lazy">`
      : `<span class="filetype-badge">${extBadge(r.ext)}</span>`;

    const meterHtml = r.match !== null && r.match !== undefined
      ? `<div class="meter-row">
           <div class="meter-track"><div class="meter-fill" style="width:${Math.max(0,Math.min(100, r.match*100))}%"></div></div>
           <span class="meter-label">${Math.round(r.match*100)}%</span>
         </div>`
      : `<div class="meter-row"><span class="meter-label" style="color:var(--slate)">—</span></div>`;

    const reviewFlag = r.confidence < 0.55 ? `<div class="review-flag">&#9888; needs review</div>` : "";

    card.innerHTML = `
      <div class="thumb-wrap">${thumbInner}</div>
      <div class="card-body">
        <div class="filename" title="${r.filename}">${r.filename}</div>
        <div class="meta-row">
          <span class="cat-tag recat-btn" title="click to recategorize">${r.category}</span>
          <span class="date">${fmtDate(r.created_at)}</span>
        </div>
        ${meterHtml}
        ${reviewFlag}
      </div>
    `;
    card.querySelector(".recat-btn").onclick = (e) => { e.stopPropagation(); openRecatModal(r); };
    grid.appendChild(card);
  }
}

function openRecatModal(record) {
  document.getElementById("modal-path").textContent = record.filepath;
  const catsEl = document.getElementById("modal-cats");
  catsEl.innerHTML = "";
  for (const cat of state.categories) {
    const b = document.createElement("div");
    b.className = "chip" + (cat === record.category ? " active" : "");
    b.textContent = cat;
    b.onclick = async () => {
      await fetch("/api/correct", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: record.id, category: cat }),
      });
      closeModal();
      runSearch();
      loadCategories();
    };
    catsEl.appendChild(b);
  }
  document.getElementById("overlay").classList.add("open");
}
function closeModal() { document.getElementById("overlay").classList.remove("open"); }
document.getElementById("modal-cancel").onclick = closeModal;
document.getElementById("overlay").onclick = (e) => { if (e.target.id === "overlay") closeModal(); };

const qInput = document.getElementById("q");
qInput.addEventListener("input", () => {
  state.q = qInput.value;
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(runSearch, 220);
});
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && document.activeElement !== qInput) {
    e.preventDefault();
    qInput.focus();
  }
  if (e.key === "Escape") closeModal();
});

loadCategories().then(runSearch);
</script>
</body>
</html>
